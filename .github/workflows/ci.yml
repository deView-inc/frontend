name: 'CI'

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    actions: read
    contents: read
    security-events: write
    pull-requests: write
    issues: write
    packages: write

jobs:
    security:
        uses: deView-inc/.github/.github/workflows/codeql.yml@master
        with:
            languages: javascript-typescript
            build-mode: none
        secrets:
            github-token: ${{ secrets.GITHUB_TOKEN }}

    label:
        if: github.event_name == 'pull_request'
        uses: deView-inc/.github/.github/workflows/pr-labeler.yml@master
        with:
            config-path: .github/labeler.yml

    docker:
        needs: security
        uses: deView-inc/.github/.github/workflows/build.yml@master
        with:
            image-name: ${{ github.repository }}
            dockerfile: ./Dockerfile
            context: .
            build-args: |
                {
                    "NODE_ENV": "production"
                }
            push-on-branches: 'master,dev'
            tag-latest: true
            tag-sha: true
            tag-branch: true
        secrets:
            github-token: ${{ secrets.GITHUB_TOKEN }}

    stale:
        if: github.event_name == 'schedule'
        uses: deView-inc/.github/.github/workflows/stale-cleanup.yml@master
        with:
            days-before-stale: 30
            days-before-close: 5
        secrets:
            github-token: ${{ secrets.GITHUB_TOKEN }}
