services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports:
            - '3000:3000'
            - '1234:1234'
        environment:
            COLLABORATION_HOST: 0.0.0.0
            COLLABORATION_PORT: '1234'
            NEXT_PUBLIC_COLLABORATION_WS_URL: ws://127.0.0.1:1234
